[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "simlaps-client"
dynamic = ["version"]
description = "SimLaps Telemetry Client - Automatic lap time submission for ACE"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "SimLaps", email = "contact@simlaps.racing"}
]
keywords = ["racing", "telemetry", "sim-racing", "lap-times"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment :: Simulation",
]

dependencies = [
    "flet>=0.86.5,<0.87",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.0.0",
    "pyarmor>=8.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
simlaps-client = "src.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.dynamic]
version = {attr = "src.version.VERSION"}

[tool.setuptools.package-data]
"src.core" = ["data/*.json"]
"src.core.analyzer" = ["vendor/*.js", "vendor/*.md"]

[tool.ruff]
# Target Python version and line lengths
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# Enable specific rule categories
# E/W = Pycodestyle, F = Pyflakes, I = Isort, B = Bugbear, S = Bandit (Security)
select = ["E", "W", "F", "I", "B", "S"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# Ignore security checks (S) inside your unit tests
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
ignore_missing_imports = true
