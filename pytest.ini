[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
pythonpath = tests
addopts = -v --tb=short -m "not packaging"
asyncio_mode = auto
markers =
    asyncio: marks tests as async
    integration: marks tests that exercise real-data integration paths
    packaging: marks tests that build and install a wheel in isolation
